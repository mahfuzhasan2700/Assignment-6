<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 160" width="100%" height="100%">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e14" />
      <stop offset="100%" stop-color="#141822" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ccff00" />
      <stop offset="100%" stop-color="#99e600" />
    </linearGradient>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&amp;family=Oswald:wght@700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, sans-serif; }
      .font-display { font-family: 'Oswald', sans-serif; text-transform: uppercase; }

      @keyframes arrowPulse {
        0%, 100% { transform: translateX(0); opacity: 0.4; }
        50% { transform: translateX(6px); opacity: 1; filter: drop-shadow(0 0 4px #ccff00); }
      }

      @keyframes nodeGlow {
        0%, 100% { stroke: #1f2533; }
        50% { stroke: #ccff00; filter: drop-shadow(0 0 6px rgba(204,255,0,0.5)); }
      }

      @keyframes iconSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes bounceCheck {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }

      .arrow-anim-1 { animation: arrowPulse 2s ease-in-out infinite; }
      .arrow-anim-2 { animation: arrowPulse 2s ease-in-out infinite 0.5s; }
      .arrow-anim-3 { animation: arrowPulse 2s ease-in-out infinite 1s; }

      .node-1 { animation: nodeGlow 4s ease-in-out infinite; }
      .node-2 { animation: nodeGlow 4s ease-in-out infinite 1s; }
      .node-3 { animation: nodeGlow 4s ease-in-out infinite 2s; }
      .node-4 { animation: nodeGlow 4s ease-in-out infinite 3s; }

      .check-bounce { animation: bounceCheck 2s ease-in-out infinite; transform-origin: 778px 64px; }
    </style>
  </defs>

  <!-- Container -->
  <rect x="0" y="0" width="880" height="160" rx="18" fill="url(#wfBg)" stroke="#1e2330" stroke-width="1.5" />

  <!-- STEP 1: BROWSE & SORT -->
  <g transform="translate(24, 24)">
    <rect x="0" y="0" width="180" height="112" rx="14" fill="#11141c" stroke="#1f2533" stroke-width="1.5" class="node-1" />
    <circle cx="34" cy="34" r="16" fill="#181e2b" />
    <path d="M 28 34 L 40 34 M 34 28 L 34 40" stroke="#ccff00" stroke-width="2" stroke-linecap="round" />
    <text x="60" y="32" fill="#64748b" font-size="10" font-weight="800">STEP 01</text>
    <text x="60" y="46" fill="#ffffff" font-size="12" font-weight="800" class="font-display">BROWSE &amp; SORT</text>
    <text x="20" y="78" fill="#94a3b8" font-size="10" font-weight="500">12 foundational lifts</text>
    <text x="20" y="94" fill="#64748b" font-size="9" font-weight="600">Sort: Duration / Cal / Star</text>
  </g>

  <!-- ARROW 1 -->
  <g transform="translate(216, 70)" class="arrow-anim-1">
    <path d="M 0 10 L 16 10 M 10 4 L 16 10 L 10 16" fill="none" stroke="#ccff00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STEP 2: LOCK 5-LIFT WORKBENCH -->
  <g transform="translate(244, 24)">
    <rect x="0" y="0" width="180" height="112" rx="14" fill="#11141c" stroke="#1f2533" stroke-width="1.5" class="node-2" />
    <circle cx="34" cy="34" r="16" fill="#181e2b" />
    <rect x="27" y="27" width="14" height="14" rx="3" fill="none" stroke="#ccff00" stroke-width="1.8" />
    <text x="31" y="38" fill="#ccff00" font-size="10" font-weight="900">5</text>
    <text x="60" y="32" fill="#64748b" font-size="10" font-weight="800">STEP 02</text>
    <text x="60" y="46" fill="#ffffff" font-size="12" font-weight="800" class="font-display">DAILY 5-LIFT CAP</text>
    <text x="20" y="78" fill="#94a3b8" font-size="10" font-weight="500">Intentional discipline</text>
    <text x="20" y="94" fill="#ccff00" font-size="9" font-weight="700">Prevents overtraining</text>
  </g>

  <!-- ARROW 2 -->
  <g transform="translate(436, 70)" class="arrow-anim-2">
    <path d="M 0 10 L 16 10 M 10 4 L 16 10 L 10 16" fill="none" stroke="#ccff00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STEP 3: LIVE TELEMETRY -->
  <g transform="translate(464, 24)">
    <rect x="0" y="0" width="180" height="112" rx="14" fill="#11141c" stroke="#1f2533" stroke-width="1.5" class="node-3" />
    <circle cx="34" cy="34" r="16" fill="#181e2b" />
    <circle cx="34" cy="34" r="7" fill="none" stroke="#38bdf8" stroke-width="1.8" />
    <text x="60" y="32" fill="#64748b" font-size="10" font-weight="800">STEP 03</text>
    <text x="60" y="46" fill="#ffffff" font-size="12" font-weight="800" class="font-display">LIVE TELEMETRY</text>
    <text x="20" y="78" fill="#94a3b8" font-size="10" font-weight="500">Real-time gym volume</text>
    <text x="20" y="94" fill="#38bdf8" font-size="9" font-weight="700">Minutes &amp; Calories sync</text>
  </g>

  <!-- ARROW 3 -->
  <g transform="translate(656, 70)" class="arrow-anim-3">
    <path d="M 0 10 L 16 10 M 10 4 L 16 10 L 10 16" fill="none" stroke="#ccff00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- STEP 4: LOG & CELEBRATE -->
  <g transform="translate(684, 24)">
    <rect x="0" y="0" width="172" height="112" rx="14" fill="#11141c" stroke="#1f2533" stroke-width="1.5" class="node-4" />
    <circle cx="34" cy="34" r="16" fill="#14532d" class="check-bounce" />
    <path d="M 28 34 L 32 38 L 40 28" fill="none" stroke="#ccff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="60" y="32" fill="#64748b" font-size="10" font-weight="800">STEP 04</text>
    <text x="60" y="46" fill="#ffffff" font-size="12" font-weight="800" class="font-display">LOG &amp; CELEBRATE</text>
    <text x="20" y="78" fill="#86efac" font-size="10" font-weight="600">Mark done with confetti</text>
    <text x="20" y="94" fill="#94a3b8" font-size="9" font-weight="500">Persistent localStorage</text>
  </g>

</svg>
