<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#12151c" />
      <stop offset="100%" stop-color="#0e1017" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161922" />
      <stop offset="100%" stop-color="#11131a" />
    </linearGradient>

    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a6e600" />
      <stop offset="100%" stop-color="#ccff00" />
    </linearGradient>

    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(204,255,0,0)" />
      <stop offset="50%" stop-color="rgba(204,255,0,0.12)" />
      <stop offset="100%" stop-color="rgba(204,255,0,0)" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glowLime" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;family=Oswald:wght@600;700&amp;display=swap');

      text {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .font-display {
        font-family: 'Oswald', -apple-system, sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      /* Animated Elements */
      @keyframes pulseGlow {
        0%, 100% {
          stroke: #ccff00;
          stroke-opacity: 0.8;
          filter: drop-shadow(0 0 6px rgba(204,255,0,0.5));
        }
        50% {
          stroke: #779900;
          stroke-opacity: 0.3;
          filter: drop-shadow(0 0 1px rgba(204,255,0,0.1));
        }
      }

      @keyframes pingRadar {
        0% {
          r: 4px;
          opacity: 1;
        }
        70%, 100% {
          r: 12px;
          opacity: 0;
        }
      }

      @keyframes fillProgress1 {
        0% { width: 0px; }
        50%, 100% { width: 144px; }
      }

      @keyframes fillProgress2 {
        0% { width: 0px; }
        50%, 100% { width: 160px; }
      }

      @keyframes fillProgress3 {
        0% { width: 0px; }
        50%, 100% { width: 120px; }
      }

      @keyframes sparkle1 {
        0%, 100% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 0.2; }
        50% { transform: translateY(-8px) scale(1.2) rotate(180deg); opacity: 1; }
      }

      @keyframes sparkle2 {
        0%, 100% { transform: translateY(0) scale(1.1) rotate(0deg); opacity: 0.9; }
        50% { transform: translateY(-10px) scale(0.7) rotate(-180deg); opacity: 0.3; }
      }

      @keyframes checkPop {
        0% { transform: scale(0.6); opacity: 0; }
        60% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes shimmerPass {
        0% { transform: translateX(-300px); }
        100% { transform: translateX(880px); }
      }

      .pulse-border {
        animation: pulseGlow 3s ease-in-out infinite;
      }

      .radar-dot {
        animation: pingRadar 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }

      .bar-fill-1 {
        animation: fillProgress1 3s ease-out infinite alternate;
      }
      .bar-fill-2 {
        animation: fillProgress2 3s ease-out infinite alternate;
      }
      .bar-fill-3 {
        animation: fillProgress3 3s ease-out infinite alternate;
      }

      .sparkle-a {
        animation: sparkle1 2.2s ease-in-out infinite;
        transform-origin: center;
      }
      .sparkle-b {
        animation: sparkle2 2.8s ease-in-out infinite;
        transform-origin: center;
      }

      .checkmark-box {
        animation: checkPop 3s ease-in-out infinite alternate;
        transform-origin: 780px 290px;
      }

      .shimmer-rect {
        animation: shimmerPass 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Window Container -->
  <rect x="0" y="0" width="880" height="460" rx="20" fill="url(#bgGrad)" stroke="#1e222b" stroke-width="2" filter="url(#cardShadow)" />

  <!-- Top App Chrome Header -->
  <rect x="0" y="0" width="880" height="52" rx="20" fill="#0d0f14" />
  <rect x="0" y="32" width="880" height="20" fill="#0d0f14" />
  <line x1="0" y1="52" x2="880" y2="52" stroke="#1c202a" stroke-width="1.5" />

  <!-- Window Controls -->
  <circle cx="28" cy="26" r="6" fill="#ef4444" opacity="0.85" />
  <circle cx="48" cy="26" r="6" fill="#f59e0b" opacity="0.85" />
  <circle cx="68" cy="26" r="6" fill="#10b981" opacity="0.85" />

  <!-- Brand Title -->
  <g transform="translate(100, 16)">
    <path d="M 6 4 L 14 12 M 14 4 L 6 12 M 3 7 L 7 3 M 13 17 L 17 13" stroke="#ccff00" stroke-width="2.5" stroke-linecap="round" />
    <text x="24" y="14" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="0.1em" class="font-display">FITLOG</text>
    <text x="82" y="14" fill="#4b5563" font-size="12" font-weight="600">//</text>
    <text x="96" y="14" fill="#9ca3af" font-size="11" font-weight="700" letter-spacing="0.08em">DAILY WORKBENCH</text>
  </g>

  <!-- Live Pulse Pill -->
  <g transform="translate(730, 16)">
    <rect x="0" y="0" width="124" height="22" rx="11" fill="#151921" stroke="#222834" stroke-width="1" />
    <circle cx="16" cy="11" r="4" fill="#ccff00" />
    <circle cx="16" cy="11" r="4" fill="none" stroke="#ccff00" stroke-width="1.5" class="radar-dot" />
    <text x="28" y="15" fill="#ccff00" font-size="10" font-weight="800" letter-spacing="0.05em">LIVE METRICS</text>
  </g>

  <!-- Ambient Shimmer Light Effect -->
  <g opacity="0.6">
    <rect x="-100" y="52" width="200" height="408" fill="url(#shimmerGrad)" class="shimmer-rect" />
  </g>

  <!-- ==================== 3 REAL-TIME TELEMETRY METRIC CARDS ==================== -->

  <!-- CARD 1: EXERCISES -->
  <g transform="translate(32, 74)">
    <rect x="0" y="0" width="254" height="116" rx="16" fill="url(#cardGrad)" stroke="#1f242e" stroke-width="1.5" class="pulse-border" />
    <text x="20" y="32" fill="#9ca3af" font-size="11" font-weight="800" letter-spacing="0.08em" class="font-display">EXERCISES</text>
    
    <!-- Icon Circle -->
    <rect x="200" y="16" width="34" height="34" rx="10" fill="#1a1e27" />
    <path d="M 212 28 L 222 38 M 222 28 L 212 38" stroke="#ccff00" stroke-width="2" stroke-linecap="round" />

    <!-- Big Value -->
    <text x="20" y="78" fill="#ffffff" font-size="34" font-weight="800" class="font-display">3</text>
    <text x="44" y="76" fill="#6b7280" font-size="13" font-weight="700">/ 5 max</text>

    <!-- Progress Track -->
    <rect x="20" y="92" width="214" height="6" rx="3" fill="#1b202a" />
    <rect x="20" y="92" width="144" height="6" rx="3" fill="url(#limeGrad)" class="bar-fill-1" />
  </g>

  <!-- CARD 2: MINUTES -->
  <g transform="translate(312, 74)">
    <rect x="0" y="0" width="254" height="116" rx="16" fill="url(#cardGrad)" stroke="#1f242e" stroke-width="1.5" />
    <text x="20" y="32" fill="#9ca3af" font-size="11" font-weight="800" letter-spacing="0.08em" class="font-display">MINUTES</text>
    
    <!-- Icon Circle -->
    <rect x="200" y="16" width="34" height="34" rx="10" fill="#1a1e27" />
    <circle cx="217" cy="33" r="8" fill="none" stroke="#38bdf8" stroke-width="2" />
    <polyline points="217,29 217,33 221,33" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" />

    <!-- Big Value -->
    <text x="20" y="78" fill="#ffffff" font-size="34" font-weight="800" class="font-display">65</text>
    <text x="62" y="76" fill="#6b7280" font-size="13" font-weight="700">min estimated</text>

    <!-- Progress Track -->
    <rect x="20" y="92" width="214" height="6" rx="3" fill="#1b202a" />
    <rect x="20" y="92" width="160" height="6" rx="3" fill="url(#skyGrad)" class="bar-fill-2" />
  </g>

  <!-- CARD 3: CALORIES -->
  <g transform="translate(592, 74)">
    <rect x="0" y="0" width="256" height="116" rx="16" fill="url(#cardGrad)" stroke="#1f242e" stroke-width="1.5" />
    <text x="20" y="32" fill="#9ca3af" font-size="11" font-weight="800" letter-spacing="0.08em" class="font-display">CALORIES</text>
    
    <!-- Icon Circle -->
    <rect x="202" y="16" width="34" height="34" rx="10" fill="#1a1e27" />
    <path d="M 219 26 Q 223 31 223 35 A 4 4 0 0 1 215 35 Q 215 31 219 26 Z" fill="none" stroke="#fb923c" stroke-width="2" />

    <!-- Big Value -->
    <text x="20" y="78" fill="#ffffff" font-size="34" font-weight="800" class="font-display">480</text>
    <text x="78" y="76" fill="#6b7280" font-size="13" font-weight="700">kcal burn</text>

    <!-- Progress Track -->
    <rect x="20" y="92" width="216" height="6" rx="3" fill="#1b202a" />
    <rect x="20" y="92" width="120" height="6" rx="3" fill="url(#fireGrad)" class="bar-fill-3" />
  </g>

  <!-- ==================== TABS ROW ==================== -->
  <g transform="translate(32, 212)">
    <!-- Tab 1: Today's Plan (Active) -->
    <rect x="0" y="0" width="146" height="34" rx="10" fill="#ccff00" />
    <text x="22" y="22" fill="#090a0d" font-size="12" font-weight="800" class="font-display">TODAY'S PLAN</text>
    <circle cx="126" cy="17" r="9" fill="#090a0d" />
    <text x="123" y="21" fill="#ccff00" font-size="11" font-weight="900">3</text>

    <!-- Tab 2: Saved -->
    <rect x="156" y="0" width="110" height="34" rx="10" fill="#13161d" stroke="#1f242e" stroke-width="1.5" />
    <text x="180" y="22" fill="#9ca3af" font-size="12" font-weight="700" class="font-display">SAVED</text>
    <circle cx="244" cy="17" r="9" fill="#1d222c" />
    <text x="241" y="21" fill="#cbd5e1" font-size="11" font-weight="800">4</text>

    <!-- Tab Underline Rule -->
    <line x1="280" y1="34" x2="816" y2="34" stroke="#1c202a" stroke-width="1.5" />
  </g>

  <!-- ==================== ACTIVE ROUTINE WORKOUT CARDS ==================== -->

  <!-- WORKOUT 1: BARBELL BENCH PRESS (COMPLETED WITH CONFETTI) -->
  <g transform="translate(32, 264)">
    <!-- Container -->
    <rect x="0" y="0" width="816" height="82" rx="16" fill="#101813" stroke="#22c55e" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Thumbnail -->
    <rect x="14" y="12" width="58" height="58" rx="12" fill="#17221b" />
    <circle cx="43" cy="41" r="14" fill="#22c55e" fill-opacity="0.2" />
    <path d="M 36 41 L 41 46 L 50 35" fill="none" stroke="#ccff00" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Badges & Title -->
    <g transform="translate(86, 22)">
      <rect x="0" y="0" width="48" height="16" rx="8" fill="#ccff00" />
      <text x="8" y="12" fill="#090a0d" font-size="9" font-weight="900" letter-spacing="0.05em">CHEST</text>

      <rect x="54" y="0" width="44" height="16" rx="8" fill="#ccff00" />
      <text x="62" y="12" fill="#090a0d" font-size="9" font-weight="900" letter-spacing="0.05em">ARMS</text>

      <rect x="104" y="0" width="46" height="16" rx="4" fill="#14532d" />
      <text x="112" y="12" fill="#86efac" font-size="9" font-weight="800">DONE</text>

      <text x="0" y="34" fill="#e2e8f0" font-size="16" font-weight="800" class="font-display">BARBELL BENCH PRESS</text>
      <text x="220" y="34" fill="#64748b" font-size="11" font-weight="500">• Barbell, Bench • 25 min • 180 kcal • ★ 4.8</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(680, 24)">
      <!-- Done Badge / Button -->
      <rect x="0" y="0" width="94" height="34" rx="10" fill="#14532d" stroke="#22c55e" stroke-width="1.2" class="checkmark-box" />
      <path d="M 16 17 L 22 23 L 32 11" fill="none" stroke="#86efac" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="21" fill="#86efac" font-size="11" font-weight="800">FINISHED</text>

      <!-- Remove X -->
      <rect x="104" y="0" width="34" height="34" rx="10" fill="#181c25" stroke="#242a36" stroke-width="1" />
      <path d="M 115 11 L 127 23 M 127 11 L 115 23" stroke="#6b7280" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Confetti Sparkle Particles -->
    <g transform="translate(650, 8)" class="sparkle-a">
      <circle cx="0" cy="0" r="3" fill="#ccff00" />
      <rect x="12" y="8" width="4" height="4" fill="#38bdf8" rx="1" />
      <circle cx="24" cy="-4" r="2.5" fill="#f43f5e" />
    </g>
    <g transform="translate(630, 48)" class="sparkle-b">
      <circle cx="0" cy="0" r="2" fill="#ccff00" />
      <rect x="-8" y="10" width="3" height="3" fill="#eab308" rx="1" />
      <circle cx="16" cy="14" r="3" fill="#a855f7" />
    </g>
  </g>

  <!-- WORKOUT 2: PULL-UP (ACTIVE PENDING) -->
  <g transform="translate(32, 358)">
    <!-- Container -->
    <rect x="0" y="0" width="816" height="82" rx="16" fill="url(#cardGrad)" stroke="#1f242e" stroke-width="1.5" />

    <!-- Thumbnail -->
    <rect x="14" y="12" width="58" height="58" rx="12" fill="#1a1e27" />
    <circle cx="43" cy="41" r="14" fill="#151922" />
    <path d="M 33 46 Q 43 32 53 46" fill="none" stroke="#ccff00" stroke-width="2.5" stroke-linecap="round" />

    <!-- Badges & Title -->
    <g transform="translate(86, 22)">
      <rect x="0" y="0" width="44" height="16" rx="8" fill="#ccff00" />
      <text x="8" y="12" fill="#090a0d" font-size="9" font-weight="900" letter-spacing="0.05em">BACK</text>

      <rect x="50" y="0" width="44" height="16" rx="8" fill="#ccff00" />
      <text x="58" y="12" fill="#090a0d" font-size="9" font-weight="900" letter-spacing="0.05em">ARMS</text>

      <text x="0" y="34" fill="#ffffff" font-size="16" font-weight="800" class="font-display">PULL-UP</text>
      <text x="82" y="34" fill="#64748b" font-size="11" font-weight="500">• Pull-up Bar • 15 min • 120 kcal • ★ 4.7</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(650, 24)">
      <!-- Mark as Done Button -->
      <rect x="0" y="0" width="124" height="34" rx="10" fill="#1c212c" stroke="#28303f" stroke-width="1.2" />
      <circle cx="16" cy="17" r="7" fill="none" stroke="#ccff00" stroke-width="1.8" />
      <path d="M 13 17 L 15 19 L 19 15" fill="none" stroke="#ccff00" stroke-width="1.8" stroke-linecap="round" />
      <text x="30" y="21" fill="#f1f5f9" font-size="11" font-weight="800">MARK AS DONE</text>

      <!-- Remove X -->
      <rect x="134" y="0" width="34" height="34" rx="10" fill="#181c25" stroke="#242a36" stroke-width="1" />
      <path d="M 145 11 L 157 23 M 157 11 L 145 23" stroke="#6b7280" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>

</svg>
