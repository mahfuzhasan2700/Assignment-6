<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 8" width="1000" height="8" preserveAspectRatio="none" role="img" aria-label="Animated section divider">
  <title>Section divider</title>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1f232b" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#1f232b" stop-opacity="1"/>
      <stop offset="82%"  stop-color="#1f232b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1f232b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ccff00" stop-opacity="0"/>
      <stop offset="38%"  stop-color="#ccff00" stop-opacity="0.55"/>
      <stop offset="50%"  stop-color="#ccff00" stop-opacity="1"/>
      <stop offset="62%"  stop-color="#ccff00" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ccff00" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes glide {
        0%   { transform: translateX(-340px); }
        100% { transform: translateX(1000px); }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.45; }
        50%      { opacity: 1; }
      }
      .sweep { animation: glide 3.2s linear infinite; }
      .mid   { animation: pulse 3.2s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .sweep { animation: none; transform: translateX(330px); }
        .mid   { animation: none; opacity: 0.8; }
      }
    </style>
  </defs>

  <rect x="0" y="3" width="1000" height="2" fill="url(#base)"/>
  <circle class="mid" cx="500" cy="4" r="2.4" fill="#ccff00"/>
  <g class="sweep">
    <rect x="0" y="2.5" width="340" height="3" rx="1.5" fill="url(#spark)"/>
  </g>
</svg>
