<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-label="FitLog animated waving footer banner">
  <title>FitLog — Footer Wave</title>
  <defs>
    <linearGradient id="ftrBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090a0d"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <linearGradient id="ftrWaveLime" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#1f232b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#090a0d" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="ftrAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ccff00" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#ccff00" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ccff00" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="140" fill="url(#ftrBg)"/>

  <!-- Wave 1 (Back Deep Curve) -->
  <path fill="url(#ftrWaveLime)" opacity="0.3">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M0 40 Q250 15 500 40 T1000 40 L1000 140 L0 140 Z;
        M0 40 Q250 65 500 40 T1000 40 L1000 140 L0 140 Z;
        M0 40 Q250 15 500 40 T1000 40 L1000 140 L0 140 Z
      "/>
  </path>

  <!-- Wave 2 (Middle Curve) -->
  <path fill="url(#ftrWaveLime)" opacity="0.6">
    <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
      values="
        M0 55 Q250 80 500 55 T1000 55 L1000 140 L0 140 Z;
        M0 55 Q250 30 500 55 T1000 55 L1000 140 L0 140 Z;
        M0 55 Q250 80 500 55 T1000 55 L1000 140 L0 140 Z
      "/>
  </path>

  <!-- Accent Crest Line -->
  <path fill="none" stroke="url(#ftrAccent)" stroke-width="2.5" opacity="0.85">
    <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
      values="
        M0 55 Q250 80 500 55 T1000 55;
        M0 55 Q250 30 500 55 T1000 55;
        M0 55 Q250 80 500 55 T1000 55
      "/>
  </path>

  <!-- Base Solid Transition -->
  <path fill="#090a0d" opacity="0.92">
    <animate attributeName="d" dur="7.5s" repeatCount="indefinite"
      values="
        M0 72 Q250 50 500 72 T1000 72 L1000 140 L0 140 Z;
        M0 72 Q250 90 500 72 T1000 72 L1000 140 L0 140 Z;
        M0 72 Q250 50 500 72 T1000 72 L1000 140 L0 140 Z
      "/>
  </path>
</svg>
